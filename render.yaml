# Blueprint do Render (render.com) para o ENSINA A.I.
# Um único serviço entrega o SITE (versão web do app) e a API (Tutor IA, login, progresso, vídeos).
# No Render: New → Blueprint → escolha este repositório. Depois preencha as chaves marcadas com sync: false.
services:
  - type: web
    name: ensina-ai-api
    runtime: node
    # Gera a versão web do app (mobile/) e instala o servidor (server/).
    buildCommand: >-
      cd mobile && npm ci && CI=1 npx expo export --platform web --output-dir ../web-build &&
      cd ../server && npm ci --omit=dev
    startCommand: cd server && node index.js
    healthCheckPath: /api/health
    plan: starter # o disco persistente exige um plano pago
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: WEB_DIR
        value: ../web-build
      - key: TUTOR_LIMITE_DIARIO
        value: "40"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ensina.ai
      - key: ADMIN_PASSWORD
        sync: false
