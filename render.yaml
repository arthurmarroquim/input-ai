# Blueprint do Render (render.com) para o servidor do ENSINA A.I.
# No Render: New → Blueprint → escolha este repositório. Depois preencha as chaves marcadas com sync: false.
services:
  - type: web
    name: ensina-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    plan: starter # o disco persistente exige um plano pago
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: TUTOR_LIMITE_DIARIO
        value: "40"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ensina.ai
      - key: ADMIN_PASSWORD
        sync: false
